<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오목 — 개미친 어려움</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>오목</h1>
      <p class="subtitle">컴퓨터와 대결 · 난이도 <strong>개미친 어려움</strong></p>
    </header>

    <section class="controls">
      <div class="control-group">
        <span class="label">돌 선택</span>
        <div class="seg" id="stoneSelect">
          <button class="seg-btn active" data-stone="black">⚫ 흑돌 (선공)</button>
          <button class="seg-btn" data-stone="white">⚪ 백돌 (후공)</button>
        </div>
      </div>
      <button id="newGameBtn" class="btn-primary">새 게임</button>
    </section>

    <section class="status" id="status">흑돌을 선택했습니다. 새 게임을 눌러 시작하세요. (3-3 금지 규칙 적용)</section>

    <section class="winrate-wrap">
      <div class="winrate-label">💻 AI 예상 승률 <span id="winRateVal">—</span></div>
      <div class="winrate-bar"><div class="winrate-fill" id="winRateFill"></div></div>
    </section>

    <div class="board-wrap">
      <canvas id="board" width="600" height="600"></canvas>
      <div class="thinking" id="thinking" hidden>컴퓨터가 생각 중…</div>
    </div>

    <section class="log-panel">
      <div class="log-head">
        <span>🧠 AI 사고 로그</span>
        <button id="clearLogBtn" class="log-clear">지우기</button>
      </div>
      <div class="log" id="log"></div>
    </section>

    <section class="learn-panel">
      <div class="learn-head">📈 강화학습</div>
      <div class="learn-stats" id="learnStats">통계 로딩 중…</div>
      <div class="learn-weights" id="learnWeights"></div>

      <div class="learn-train">
        <label class="learn-label">자가학습 반복
          <input type="number" id="trainIters" value="15" min="1" max="200" />회
        </label>
        <button id="trainBtn" class="btn-primary">자가학습 실행</button>
        <button id="cancelTrainBtn" class="btn-secondary" hidden>중지</button>
      </div>
      <div class="learn-progress" id="trainProgress" hidden>
        <div class="learn-progress-bar"><div class="learn-progress-fill" id="trainProgressFill"></div></div>
        <span id="trainProgressText"></span>
      </div>

      <div class="learn-actions">
        <button id="exportBtn" class="learn-btn">로그 내보내기(JSON)</button>
        <button id="importBtn" class="learn-btn">불러오기</button>
        <input type="file" id="importFile" accept="application/json" hidden />
        <button id="resetLearnBtn" class="learn-btn danger">학습 초기화</button>
      </div>
    </section>

    <footer class="footer">
      <span id="moveCount">수: 0</span>
      <span class="hint">자세한 분석은 브라우저 콘솔(F12)에도 출력됩니다. 학습 데이터는 이 브라우저에 저장됩니다.</span>
    </footer>
  </div>

  <script src="ai.js"></script>
  <script src="default-learning.js"></script>
  <script src="learning.js"></script>
  <script src="game.js"></script>
</body>
</html>
